# Gerado por scripts/servidores.py a partir de public/_redirects. Não edite à mão.
# Inclua este arquivo dentro do bloco "server" do site.

root /var/www/loja-brasilia;   # ajuste para a pasta onde está o conteúdo de dist/
index index.html;
error_page 404 /404.html;

location ~ ^/sobre-a-maconaria/historia-da-loja-brasilia(/.*)?$ { return 301 /a-loja/; }
location ~ ^/bem-vindo/veneraveis-passados-da-loja-brasilia(/.*)?$ { return 301 /a-loja/#veneraveis; }
location ~ ^/o-ritual-de-emulacao(/.*)?$ { return 301 /ritual-de-emulacao/; }
location ~ ^/a-grande-loja-unida-da-inglaterra(/.*)?$ { return 301 /ritual-de-emulacao/; }
location ~ ^/arco-real-e-marca(/.*)?$ { return 301 /corpos-associados/; }
location ~ ^/membros/referencias/aprendizes/capitulo(/.*)?$ { return 301 /corpos-associados/#arco-real; }
location ~ ^/info/lbmmm(/.*)?$ { return 301 /corpos-associados/#marca; }
location ~ ^/sobre-a-maconaria/quer-se-tornar-um-macom(/.*)?$ { return 301 /quero-ser-macom/; }
location ~ ^/sobre-a-maconaria(/.*)?$ { return 301 /a-loja/; }
location ~ ^/bem-vindo(/.*)?$ { return 301 /; }
location ~ ^/login(/.*)?$ { return 301 /; }
location ~ ^/index\.php(/.*)?$ { return 301 /; }

location / {
    try_files $uri $uri/ =404;
}
